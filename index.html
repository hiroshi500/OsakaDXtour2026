<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>近畿インフラDX大阪研修旅行｜白山野々市建設業協会青年委員会</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>
  :root {
    --primary-day1: #ff6600;
    --primary-day1-light: #fff5ee;
    --primary-day2: #0066cc;
    --primary-day2-light: #f0f7ff;
    --accent-yellow: #ffcc00;
    --text-color: #2b2b2b;
    --bg-color: #f4f6f8;
    --card-shadow: 0 4px 16px rgba(0,0,0,0.06);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg-color);
    color: var(--text-color);
    line-height: 1.6;
  }

  /* ----------------------------------
     表紙（ヒーロー）
  ---------------------------------- */
  .hero {
    position: relative;
    padding: 24px 16px 20px;
    background: linear-gradient(135deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.4) 100%), url("https://upload.wikimedia.org/wikipedia/commons/thumb/6/68/Osaka_Castle_02bs3200.jpg/1200px-Osaka_Castle_02bs3200.jpg") center/cover no-repeat #444;
    color: white;
    text-align: center;
  }
  .hero-badge {
    display: inline-block;
    background: var(--accent-yellow);
    color: #222;
    font-weight: 700;
    font-size: 0.75rem;
    padding: 3px 12px;
    border-radius: 50px;
    margin-bottom: 6px;
  }
  .hero-title {
    font-size: 1.5rem;
    font-weight: 900;
    line-height: 1.3;
    margin: 0 0 8px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
  }
  .hero-meta {
    display: flex;
    justify-content: center;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .hero-meta-item {
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(6px);
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 0.78rem;
    font-weight: 600;
    border: 1px solid rgba(255,255,255,0.25);
  }
  .hero-btn {
    display: inline-block;
    padding: 8px 24px;
    border-radius: 50px;
    background: var(--accent-yellow);
    color: #222;
    text-decoration: none;
    font-weight: 700;
    font-size: 0.85rem;
    box-shadow: 0 3px 10px rgba(255, 204, 0, 0.4);
  }

  .container {
    max-width: 800px;
    margin: 0 auto;
    padding: 0 12px 40px;
  }

  .section {
    background: white;
    margin-top: 16px;
    padding: 20px 16px;
    border-radius: 16px;
    box-shadow: var(--card-shadow);
  }
  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 2px solid #eee;
    padding-bottom: 8px;
    margin-bottom: 16px;
  }
  .section-tag {
    background: var(--primary-day1);
    color: white;
    font-weight: 800;
    font-size: 0.8rem;
    padding: 3px 10px;
    border-radius: 6px;
  }
  .section-title {
    font-size: 1.25rem;
    font-weight: 800;
    margin: 0;
    color: #111;
  }

  .highlights-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 12px;
  }
  .highlight-card {
    position: relative;
    height: 110px;
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 10px;
    text-decoration: none;
    color: white;
    background-size: cover;
    background-position: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  }
  .highlight-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.2) 70%);
  }
  .highlight-content {
    position: relative;
    z-index: 1;
  }
  .highlight-icon {
    font-size: 1.1rem;
    margin-bottom: 2px;
  }
  .highlight-title {
    font-weight: 700;
    font-size: 0.82rem;
    line-height: 1.25;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }

  .card-dx { background-image: url("https://upload.wikimedia.org/wikipedia/commons/thumb/3/3d/Komatsu_PC200-8.jpg/800px-Komatsu_PC200-8.jpg"); }
  .card-castle { background-image: url("https://upload.wikimedia.org/wikipedia/commons/thumb/6/68/Osaka_Castle_02bs3200.jpg/1200px-Osaka_Castle_02bs3200.jpg"); }
  .card-fushimi { background-image: url("https://upload.wikimedia.org/wikipedia/commons/thumb/b/b5/Fushimi_Inari_Taisha_Senbon_Torii_2016.jpg/800px-Fushimi_Inari_Taisha_Senbon_Torii_2016.jpg"); }

  .day2 .section-tag { background: var(--primary-day2); }

  /* ----------------------------------
     タイムライン
  ---------------------------------- */
  .timeline {
    position: relative;
    padding-left: 20px;
  }
  .timeline::before {
    content: "";
    position: absolute;
    left: 6px;
    top: 6px;
    bottom: 6px;
    width: 3px;
    background: #eee;
    border-radius: 2px;
  }
  .day1 .timeline::before { background: var(--primary-day1); }
  .day2 .timeline::before { background: var(--primary-day2); }

  .timeline-item {
    position: relative;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .timeline-item:last-child { margin-bottom: 0; }

  .timeline-dot {
    position: absolute;
    left: -20px;
    top: 6px;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: white;
    border: 3px solid var(--primary-day1);
  }
  .day2 .timeline-dot { border-color: var(--primary-day2); }

  .timeline-body {
    flex: 1;
  }
  .timeline-time {
    font-weight: 800;
    font-size: 0.92rem;
    color: var(--primary-day1);
    margin-bottom: 1px;
  }
  .day2 .timeline-time { color: var(--primary-day2); }

  .timeline-spot {
    font-size: 1.05rem;
    font-weight: 700;
    color: #111;
  }

  /* 右側の公式HP画像リンク */
  .timeline-photo-link {
    position: relative;
    display: block;
    width: 82px;
    height: 64px;
    border-radius: 8px;
    overflow: hidden;
    flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    text-decoration: none;
    background: #eee;
  }
  .timeline-thumb {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.3s ease;
  }
  .timeline-photo-link:hover .timeline-thumb {
    transform: scale(1.08);
  }
  .hp-badge {
    position: absolute;
    bottom: 2px;
    right: 2px;
    background: rgba(0, 0, 0, 0.75);
    color: #fff;
    font-size: 0.58rem;
    font-weight: 700;
    padding: 1px 4px;
    border-radius: 3px;
  }

  /* マップ文字リンク */
  .map-link {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    color: #111;
    text-decoration: none;
    border-bottom: 1.5px solid var(--accent-yellow);
  }
  .map-link:active { opacity: 0.7; }
  .map-icon { font-size: 0.8em; }

  .timeline-desc {
    font-size: 0.85rem;
    color: #666;
    margin-top: 2px;
    line-height: 1.4;
  }

  .info-card {
    background: #fffbe6;
    border: 1.5px dashed #ffe58f;
    border-radius: 12px;
    padding: 16px;
  }
  .info-card h3 {
    margin-top: 0;
    color: #873800;
    font-size: 1rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .info-list {
    margin: 0;
